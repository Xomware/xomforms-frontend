name: Deploy Xomforms Frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-frontend-s3.yml@v1
    with:
      app: xomforms
      node-version: '18'
      install-command: npm ci --legacy-peer-deps
      ssm: |
        COGNITO_USER_POOL_ID=/xomware/shared/cognito/user-pool-id
        COGNITO_CLIENT_ID=/xomware/shared/cognito/clients/xomforms-id
        COGNITO_DOMAIN=/xomware/shared/cognito/hosted-ui-domain
      build-command: |
        f=src/environments/environment.ts
        sed -i "s|cognitoUserPoolId: ''|cognitoUserPoolId: '$COGNITO_USER_POOL_ID'|" $f
        sed -i "s|cognitoClientId: ''|cognitoClientId: '$COGNITO_CLIENT_ID'|" $f
        sed -i "s|cognitoDomain: 'xomware-auth.auth.us-east-1.amazoncognito.com'|cognitoDomain: '$COGNITO_DOMAIN'|" $f
        if grep -nE "(cognitoUserPoolId|cognitoClientId): *''" $f; then
          echo "::error::environment.ts still has empty Cognito values"
          exit 1
        fi
        npm run build:prod
      dist-dir: dist/xomforms-frontend/browser
      bucket: xomforms.xomware.com
      domain: xomforms.xomware.com
