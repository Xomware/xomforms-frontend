<svg
  class="xf-icon"
  [class.xf-icon--filled]="isFilled"
  [style.width.px]="size"
  [style.height.px]="size"
  viewBox="0 0 24 24"
  [attr.fill]="isFilled ? 'currentColor' : 'none'"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.role]="label ? 'img' : null"
  [attr.aria-label]="label || null"
  [attr.aria-hidden]="label ? null : 'true'"
  focusable="false"
>
  <ng-container [ngSwitch]="name">
    <ng-container *ngSwitchCase="'pin'">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
      <circle cx="12" cy="10" r="3" />
    </ng-container>

    <ng-container *ngSwitchCase="'monitor'">
      <rect x="2" y="4" width="20" height="13" rx="2" />
      <path d="M8 21h8M12 17v4" />
    </ng-container>

    <ng-container *ngSwitchCase="'clock'">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    </ng-container>

    <ng-container *ngSwitchCase="'moon'">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
    </ng-container>

    <ng-container *ngSwitchCase="'pencil'">
      <path d="m4 20 4-1 10-10a2.1 2.1 0 0 0-3-3L5 16Z" />
      <path d="m14 5 3 3" />
    </ng-container>

    <ng-container *ngSwitchCase="'calendar'">
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M3 10h18M8 3v4M16 3v4" />
    </ng-container>

    <ng-container *ngSwitchCase="'clipboard'">
      <path d="M9 4h6v3H9z" />
      <path d="M15 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2" />
    </ng-container>

    <ng-container *ngSwitchCase="'check'">
      <path d="m5 13 4 4L19 7" />
    </ng-container>

    <ng-container *ngSwitchCase="'star'">
      <path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.8 6.7 19.6l1.1-6L3.4 9.4l6-.8Z" />
    </ng-container>

    <ng-container *ngSwitchCase="'close'">
      <path d="M6 6l12 12M18 6 6 18" />
    </ng-container>

    <ng-container *ngSwitchCase="'chevron-left'">
      <path d="m14 6-6 6 6 6" />
    </ng-container>

    <ng-container *ngSwitchCase="'chevron-right'">
      <path d="m10 6 6 6-6 6" />
    </ng-container>

    <ng-container *ngSwitchCase="'plus'">
      <path d="M12 5v14M5 12h14" />
    </ng-container>
  </ng-container>
</svg>
