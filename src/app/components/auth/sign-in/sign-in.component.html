<div class="sign-in-page">
  <h1>Sign in</h1>
  <p class="hint">Uses your existing Xomware account (same sign-in as xomware.com).</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
      <p class="field-error" *ngIf="fieldInvalid('email')">Enter a valid email address.</p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      <p class="field-error" *ngIf="fieldInvalid('password')">Password must be at least 8 characters.</p>
    </div>

    <p class="form-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

    <button type="submit" class="submit-btn" [disabled]="loading">
      {{ loading ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
